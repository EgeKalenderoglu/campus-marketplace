<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ listing.title }} - Campus Marketplace</title>
    <link rel="stylesheet" href="{{ url_for("static", filename="style.css") }}">
</head>
<body>

        <h1>{{ listing.title }}</h1>

    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Listing - Campus Marketplace</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top py-2">
        <div class="container d-flex justify-content-between align-items-center">
            <h3 class="mb-0">Campus Marketplace</h3>
            <div class="d-flex align-items-center gap-3">
                <a href="/user" class="btn btn-outline-primary">My Profile</a>
                <a href="/logout" class="btn btn-danger">Log Out</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Create Listing</h1>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">

            <label for="title">Item Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Example: Calculus Textbook"
                required
            >

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the item"
                required
            ></textarea>

            <label for="price">Price ($)</label>
            <input
                type="number"
                id="price"
                name="price"
                step="0.01"
                min="0"
                placeholder="25.00"
                required
            >

            <button type="submit">Create Listing</button>

        </form>

        <div class="mt-3">
            <a href="/main">Back to Marketplace</a>
        </div>
    </div>

    <!-- Bootstrap JavaScript Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js" integrity="sha384-+sLIOodYLS7CIrQpBjl+C7nPvqq+FbNUBDunl/OZv93DB7Ln/533i8e/mZXLi/P+" crossorigin="anonymous"></script>
    <!-- CUSTOM Isolated JavaScript File -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Campus Marketplace</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm rounded-4 p-4 mx-auto" style="max-width: 600px;">
            <h1 class="mb-4">My Profile</h1>

            <div class="mb-3">
                <label class="fw-bold d-block">Username</label>
                <div>{{ user.username }}</div>
            </div>

            <div class="mb-3">
                <label class="fw-bold d-block">Email</label>
                <div>{{ user.email }}</div>
            </div>

            <div class="mb-3">
                <label class="fw-bold d-block">Verification Status</label>
                <div>
                    {% if user.is_verified %}
                        <span class="badge bg-success">Verified</span>
                    {% else %}
                        <span class="badge bg-warning text-dark">Pending Verification</span>
                    {% endif %}
                </div>
            </div>

            <div class="d-flex gap-3">
                <a href="/main" class="btn btn-primary">Back to Marketplace</a>
                <a href="/create_listing" class="btn btn-outline-secondary">Create Listing</a>
                <a href="/logout" class="btn btn-danger">Log Out</a>
            </div>
        </div>
    </div>
</body>
</html>
